name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install sidenavigation dependencies
        working-directory: hel-proto-sidenavigation
        run: npm install --legacy-peer-deps

      - name: Build sidenavigation
        working-directory: hel-proto-sidenavigation
        run: npm run build

      - name: Install dashboard dependencies
        working-directory: hel-proto-ai-dashboard
        run: npm install --legacy-peer-deps

      - name: Build dashboard
        working-directory: hel-proto-ai-dashboard
        run: npm run build

      - name: Install date-range-picker dependencies
        working-directory: hel-proto-date-range-picker
        run: npm install --legacy-peer-deps

      - name: Build date-range-picker
        working-directory: hel-proto-date-range-picker
        run: npm run build

      - name: Combine build outputs
        run: |
          mkdir -p combined-dist
          cp -r hel-proto-sidenavigation/dist/. combined-dist/
          mkdir -p combined-dist/hel-proto-ai-dashboard
          cp -r hel-proto-ai-dashboard/dist/. combined-dist/hel-proto-ai-dashboard/
          mkdir -p combined-dist/hel-proto-date-range-picker
          cp -r hel-proto-date-range-picker-v1-static/. combined-dist/hel-proto-date-range-picker/
          mkdir -p combined-dist/hel-proto-date-range-picker-v2
          cp -r hel-proto-date-range-picker/dist/. combined-dist/hel-proto-date-range-picker-v2/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: combined-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
